global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["MasterControl:9090"]
  - job_name: node-exporter
    static_configs:
      - targets: ["MasterControl:9100", "MasterDB:9100", "WorkerC1:9100", "WorkerC2:9100", "WorkerC3:9100"]
